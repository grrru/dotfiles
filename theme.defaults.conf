# Every theme setting, with the value used when nothing overrides it. This is
# the only place those defaults live -- scripts/toggle-theme loads it first,
# so changing a value here changes it on every machine.
#
# To change one machine only, put just the keys that differ into the
# git-ignored theme.conf in the dotfiles root, then run `toggle-theme --apply`.
# The override is looked up in $DOTFILES_THEME_CONF, <dotfiles>/theme.conf,
# ~/.config/dotfiles/theme.conf; the first existing file wins.
#
# Both files are sourced as shell by scripts/toggle-theme, and nothing else
# reads them: every tool gets a generated file instead (ghostty/theme.local,
# tmux/theme.local, ~/.theme_mode for Neovim, the `theme` key of Claude Code's
# settings.json).

# === Ghostty ===
# Theme names as listed by `ghostty +list-themes`.
GHOSTTY_LIGHT_THEME="Catppuccin Latte"
GHOSTTY_DARK_THEME="Catppuccin Frappe"

# font-thicken strength per mode. 0 disables thickening for that mode.
LIGHT_FONT_THICKEN_STRENGTH="70"
DARK_FONT_THICKEN_STRENGTH="0"

# === Neovim ===
# Colorscheme names, as passed to :colorscheme. The colorscheme must be
# provided by a plugin Neovim actually loads: the repo ships catppuccin and
# nightfox, and machine-local plugin specs can be dropped into
# gruvim/lua/local/plugins/ (git-ignored) to add more.
NVIM_LIGHT_COLORSCHEME="catppuccin-latte"
NVIM_DARK_COLORSCHEME="catppuccin-frappe"

# === Claude Code ===
# Written into ~/.claude/settings.json (or $CLAUDE_CONFIG_DIR) with jq, so the
# integration is skipped when jq or that file is missing. Valid names: light,
# dark, light-daltonized, dark-daltonized, light-ansi, dark-ansi. Set either
# key to "" to leave Claude Code's theme alone.
CLAUDE_LIGHT_THEME="light"
CLAUDE_DARK_THEME="dark"

# Claude Code reads that setting only at startup. With this set to 1, running
# sessions are switched too, by driving their `/theme` picker: toggle-theme
# types into the tmux panes running claude, and Neovim does the same through
# the job channel for the ones in its terminal buffers. A half-typed message
# in the prompt is cleared before that and pasted back after, and sessions
# that are busy or sitting on a dialog are left alone -- those keep the old
# theme until the next toggle.
CLAUDE_LIVE_THEME="0"

# === tmux ===
TMUX_LIGHT_STATUS_FG="#282C33"
TMUX_LIGHT_STATUS_BG="#d5d6db"
TMUX_LIGHT_PANE_BORDER_FG="#d5d6db"
TMUX_LIGHT_PANE_ACTIVE_BORDER_FG="#1D66F5"

TMUX_DARK_STATUS_FG="#d5d6db"
TMUX_DARK_STATUS_BG="#282C33"
TMUX_DARK_PANE_BORDER_FG="#3D4350"
TMUX_DARK_PANE_ACTIVE_BORDER_FG="#89b4fa"

# Same in both modes.
TMUX_MESSAGE_STYLE="bg=#e49931,fg=#282C33"
TMUX_MESSAGE_COMMAND_STYLE="bg=#282C33,fg=#e49931"

# Copy mode: the selection and position indicator (mode-style), then search
# matches and the mark. tmux's defaults draw the text in fg=black, palette
# color 0, which Ghostty's Catppuccin Latte makes a light gray -- so the text
# is a fixed dark color instead.
TMUX_MODE_STYLE="bg=yellow,fg=#282C33"
TMUX_COPY_MODE_MATCH_STYLE="bg=cyan,fg=#282C33"
TMUX_COPY_MODE_CURRENT_MATCH_STYLE="bg=magenta,fg=#282C33"
TMUX_COPY_MODE_MARK_STYLE="bg=red,fg=#282C33"
